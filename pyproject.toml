[project]
name = "morphology-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dill>=0.4.1",
    "flax>=0.12.7",
    "gymnasium[box2d]>=1.2.3",
    "hydra-core>=1.3",
    "hydra-joblib-launcher>=1.2",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    # cuda12 (not cuda13): CUDA 13 dropped Volta (CC 7.0, e.g. the dgx2 V100s
    # in the HPC nodelist). The cu12 build supports Volta through Hopper, i.e.
    # every GPU this project targets, so one env covers all nodes.
    "jax[cuda12]>=0.5.3",
    # ⚠ The floor MUST stay >=0.2.0, and it is a correctness pin, not a preference.
    # jaxmarl 0.0.3-0.1.0 hard-pin `jax==0.4.17.*` / `jaxlib==0.4.17.*`, which this
    # repo's jax (0.10.2) cannot satisfy, so a floor of `>=0.0.2` silently backtracks
    # all the way to 0.0.2 (Nov 2023) instead of failing. 0.2.0 requires only
    # `jax>=0.4.25` and resolves cleanly. The two releases disagree on SMAX's
    # per-unit observation features — 0.0.2 has 5 (`last_action`), >=0.0.3 has 7
    # (`last_movement_x/y`, `last_targeted`) — so obs_dim differs (270 vs 230 at
    # 10m_vs_11m) while `global_state_dim` and `action_dim` match exactly. Nothing
    # crashes when training from scratch; you just silently train on a different
    # observation than every checkpoint trained elsewhere. See CLAUDE.md § SMAX.
    "jaxmarl>=0.2.0",
    "matplotlib>=3.10.8",
    "mujoco-mjx>=3.10.0",
    "mvlearn>=0.4.1",
    "notebook>=7.5.3",
    "optax>=0.2.8",
    "pandas>=2.3.3",
    "pygame-ce>=2.5.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.2",
    "torch==2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# gymnasium[box2d] pulls in regular `pygame`, which conflicts with `pygame-ce`
# (same `pygame` import package). Neutralize that transitive requirement so the
# community edition (pygame-ce) provides the module instead.
override-dependencies = ["pygame ; sys_platform == 'never'"]


