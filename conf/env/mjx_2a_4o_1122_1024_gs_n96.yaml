# @package _global_
# Extra-data control for `simplified_feudal_tanh_relative_input_interventions`
# at intervention_interval 1 (plans/simplified_feudal_interventions_2026-10-05.md).
#
# `mjx_2a_4o_1122_1024_gs` with n_envs 32 -> 96. Under forks, n_total_steps caps
# SIMULATOR steps, and one intervention update steps 32 main + 64 fork lanes for
# 1056 steps, i.e. 101376 simulator steps, as many as one update here. Run under
# the PARENT model at the same n_total_steps, this group therefore matches the
# intervention arm on number of updates (986 at 1e8), worker rows per update
# and total simulator steps. It separates the benefit of targeted forks from the
# benefit of more data per update. For interval k use n_envs of about
# 32 * (1 + 2 * ceil(33/k) / 33) (approximate unless that is an integer).
#
# A twin group, not a CLI override: `env.n_envs=96` would write into (and a
# resume would load from) the parent group's results directory.
env:
  environment: multi_box_push_mjx
  n_envs: 96
  n_agents: 2
  n_objects: 4
  reward_mode: dense
  variant: trunc
  use_global_state: true
  coupling_def: [1,1,2,2]
