# @package _global_
#
# mjx_16a_4o + the box drift ("decay") mechanic: every box whose coupling
# requirement is NOT currently met sinks toward the bottom wall, so progress
# decays on any box the team is not working on. Kills the sequential
# swarm-one-box-at-a-time strategy that makes the dense arm easy for MAPPO —
# a sequential schedule arithmetically cannot reach its last box.
#
# Ablate against `mjx_16a_4o` (baseline) AND `mjx_16a_4o_trunc` (which carries
# only the boundary_truncates change): this arm differs from the baseline in two
# ways, so without the middle arm the result is not attributable.
#
# NOTE: difference rewards are structurally BLIND to this pressure — an
# unattended box's drift cost does not depend on agent i, so it cancels in
# D_i = G - G_-i. Use this arm in the dense/team-reward study.
env:
  environment: multi_box_push_mjx
  n_envs: 32
  n_agents: 16
  n_objects: 4
  reward_mode: dense

  variant: drift

params:
  n_steps: 512