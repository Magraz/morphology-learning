# @package _global_
#
# mjx_16a_4o on a circular arena with one concentric goal ring per box
# (`MultiBoxMultiGoalPushMJX`). The [0, goal_outer_radius] disc is cut into
# `n_objects` rings of equal width and **box j must be delivered to ring j
# counted from the center out** — box 0 to the central disc, box 1 to the
# annulus around it, and so on. At 16a/4o that is 4 rings of width 3.20:
# [0, 3.2], [3.2, 6.4], [6.4, 9.6], [9.6, 12.8], inside an arena of radius 23.
#
# Ablate against `mjx_16a_4o` (the square arena, single goal band at the top
# wall). Two things change at once — the arena shape and the per-box goals — so
# a difference between the two arms is not attributable to either alone; the
# point of this arm is the *task*, not a controlled geometry ablation.
#
# What makes it harder than a shared goal: the boxes stop being
# interchangeable. Delivering all four requires a partition of the team (the
# coupling requirement is 4 = 16/4, so exactly one minimum coalition per box),
# *and* the coalitions must respect the assignment — a box parked in another
# box's ring counts for nothing and keeps bleeding shaping. The inner boxes must
# also be pushed past the outer rings without dislodging what is already parked
# there.
#
# The observation layout is unchanged (the shared 40-dim OBS_DIM), so the `mlp`
# model group and every downstream stat/plot apply as-is. `goal_distance` is now
# per-agent: the radial offset from the centerline of the ring belonging to the
# box that agent is sensing.
#
# The square arena's box-drift mechanic and its `variant` preset do not exist
# here — do not set `env.variant`. The `trunc` arm's **inert walls** are adopted
# as this env's default (`boundary_ends_episode: false`): the wall segments are
# real inward-facing planes so agents are already confined, and terminating on
# contact was Box2D parity, not physics. It matters more here than in the square
# arena because agents spawn in the *outer* annulus (right against the wall),
# `boundary_hit` is `any()` over all 16, and the crash step used to pay 0 —
# which, with ~1/3 of episodes carrying net-negative shaping, made crashing a
# standing bonus. Set `boundary_ends_episode: true` to restore the baseline's
# terminate-on-contact semantics (e.g. to ablate this change).
env:
  environment: multi_box_multi_goal_push_mjx
  # vmap width on one device, not a core budget — keep identical across arms
  # being compared (the per-update batch is params.n_steps * n_envs).
  n_envs: 32
  n_agents: 16
  n_objects: 4
  reward_mode: dense
  # Inert walls (the `trunc` treatment) — this is the default, stated
  # explicitly so the arm is fully identified by its config.
  boundary_ends_episode: false
  # Per-box coupling requirement. `even` = n_agents // n_objects = 4 for all
  # four boxes. NOTE this makes the `coupling_fraction` observation (obs[40])
  # a CONSTANT 0.25 — it carries no information under `even`.
  # `random` draws [2, n_agents//2] per box from a fixed rng(42): at 16a/4o that
  # is [2, 7, 6, 5], so obs[40] becomes {0.125, 0.3125, 0.375, 0.4375}. Two
  # consequences before switching:
  #   - the couplings sum to 20 > 16 agents, so no *simultaneous* partition
  #     exists; the team must deliver over-subscribed boxes sequentially;
  #   - box sizes follow the coupling (`max(1.5, coupling*0.4)`) and the goal
  #     rings are derived from the largest box, so the whole geometry shifts
  #     (rings 4.80 -> 4.67 wide, rim 19.20 -> 18.69).
  # The rng seed is fixed, so every trial_id sees the same coupling vector.
  coupling_def: even

params:
  n_steps: 1024
