# @package _global_
#
# FiLM worker + RECURRENT manager: `feudal_film` with FuN's dilated LSTM core in
# place of the stateless MLP. One key apart from `feudal_film`, which is the
# control it must be read against.
#
# The core's state is a pool of `radius` sub-states (radius defaults to the goal
# horizon `c`); at step t only group `t % r` is read and written, so a group's
# gradient path spans r× more real time — the mechanism FuN uses to let the
# manager commit to a directive over a horizon rather than re-deciding every
# step. See CLAUDE.md, "Recurrent manager (`manager_core: dilated_lstm`)", for
# the measured decision NOT to use `jax.checkpoint` on the BPTT.
#
# ⚠ THIS FILE WAS INERT UNTIL 2026-09-22 AND ITS EXISTING RESULTS ARE STALE.
# It was created (commit `9c0c1b3`, "added 3 more yamls") by copying
# `feudal_film.yaml` wholesale, and `manager_core: dilated_lstm` was never
# added — so the arm was a byte-for-byte duplicate of `feudal_film` under a name
# claiming recurrence, and nothing warned. Diagnosed from the CHECKPOINT, which
# cannot lie about what trained: `manager/params/core` held a single
# `Dense(384, 256)` (the mlp core) where every genuine `*_dilated` arm holds
# `LSTMCell_0/{ii,if,ig,io,hi,hf,hg,ho}` gates. The 6 affected trials are
# `mjx_12a_3o_trunc_1024` and `mjx_12a_3o_partition_1024`, seeds 0-2; they are
# valid `feudal_film` runs and worthless as recurrence evidence. They are not
# checkpoint-compatible with this file any more, so a `checkpoint=true` resume
# now fails LOUDLY on the core shape mismatch rather than silently continuing.
# Re-run them.
#
#   uv run python train.py algorithm=feudal_mappo_jax \
#       env=mjx_12a_3o_trunc_1024 model=feudal_film_dilated trial_id=0
defaults:
  - feudal_film
  - _self_

model_params:
  manager_core: dilated_lstm
