# @package _global_
# Delta: `manager_core: dilated_lstm`. See `feudal_film_dilated.yaml` for the
# recurrence and `feudal_zerogoal.yaml` for the goal ablation.
#
# Worth knowing before reading any other arm in this family: on
# `mjx_12a_3o_trunc_1024` this is the BEST feudal arm measured (293.7, above
# `mlp` at 272.3) — and its goals are provably disconnected. Any goal-conditioned
# arm has to beat THIS, not just beat `feudal_film`.
defaults:
  - feudal_film_zerogoal
  - _self_

model_params:
  manager_core: dilated_lstm
