# @package _global_
# Delta: `manager_latent: local_global_private`.
#
# Both local axes at once: per-agent projections AND a global-state read on the
# goal path — the SMAX arm, dead weight on MJX. See
# `feudal_film_local_global_private.yaml`.
#
# This arm is CONCAT fusion. The latent rationale is written against the FiLM
# arms because those are the alpha=0 controls it was measured on, but the latent
# is a property of the MANAGER and is unchanged by the worker's fusion; see
# `feudal_film.yaml` for why concat is the weaker of the two.
#
# Alpha is inherited from `feudal_n01` (= 0.1).
defaults:
  - feudal_n01_local_private
  - _self_

model_params:
  manager_latent: local_global_private
