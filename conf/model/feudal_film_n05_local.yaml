# @package _global_
# Delta: `manager_latent: local`.
#
# The LOCAL latent: `s_i` is built by a SHARED per-agent encoder from agent i's
# OWN observation, instead of being a slice of one Dense over the joint state.
# See `feudal_film_local.yaml`.
#
# Alpha is inherited from `feudal_film_n05` (= 0.5).
defaults:
  - feudal_film_n05
  - _self_

model_params:
  manager_latent: local
