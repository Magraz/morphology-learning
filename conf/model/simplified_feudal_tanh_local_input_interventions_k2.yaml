# @package _global_
# Delta from `simplified_feudal_tanh_local_input_interventions`:
# intervention_interval 1 -> 2.
#
# Forks run at every 2nd manager decision instead of every one (17 of the 33
# windows of a rollout, windows 0, 2, ..., 32). Skipped windows hold fully
# masked placeholder rows and run no fork physics. Everything else about the
# forks is the parent's (see its header and
# algorithms/simplified_feudal_mappo_jax/interventions.py).
#
# The forks count toward the parent's per-update batch: the main rollout runs
# 21 of the env group's 32 envs, so an update simulates 33,600 steps (the
# parent's 33,792 to within one env's share) and a 1e8 budget gives 2976
# updates. The matched control is the parent on the same env group. Results
# trained before 2026-10-12 used the old appended design (one fork per agent on
# top of a full rollout; 1457 updates at 2a/4o, 723 at 6a/4o).
#
# The interval leaves checkpoints shape-identical to the parent's, so this model
# group name in the results path is the only record of it. Plan:
# plans/simplified_feudal_interventions_2026-10-05.md.
#
#   uv run python train.py algorithm=simplified_feudal_mappo_jax \
#       env=mjx_2a_4o_1122_1024_gs \
#       model=simplified_feudal_tanh_local_input_interventions_k2 trial_id=0
defaults:
  - simplified_feudal_tanh_local_input_interventions
  - _self_

model_params:
  intervention_interval: 2      # fork at every k-th manager decision
