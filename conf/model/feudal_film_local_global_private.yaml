# @package _global_
#
# Delta: `manager_latent: local_global_private` — the `global` axis added to
# `feudal_film_local_private`. THE SMAX ARM.
#
# The local family is a 2x2 over two INDEPENDENT axes on top of the shared
# per-agent encoder, and this is both at once:
#
#     model group                            private   global
#     feudal_film_local                         -         -
#     feudal_film_local_private                 X         -
#     feudal_film_local_global                  -         X
#     feudal_film_local_global_private (this)   X         X
#
#     obs_i --f_enc (SHARED, per agent)--> W_i --> s_i
#     global_state --f_percept--> z
#     concat([s_1..s_N], z) --core--> y --W^g_i--> g_i
#
# For each axis on its own, read the single-axis file: the `global` axis and the
# SMAX enemy-visibility measurement that motivates it are in
# `feudal_film_local_global.yaml`; the `private` axis and the row-diversity
# collapse it repairs are in `feudal_film_local_private.yaml`.
#
# WHY BOTH TOGETHER, AND ONLY ON SMAX. The two axes fix two different,
# independently-measured defects, and on SMAX BOTH are live — so either
# single-axis arm there takes one fix and leaves the other in place. Without
# `global` the manager assigns goals having never seen the enemy team (100% of
# alive enemies are invisible to every ally at t=0, and `goal_horizon: 10` is
# exactly the window the first pooled w_t is assembled in), making it strictly
# BLINDER than the centralized branch it is compared against — which turns a
# structural comparison into an information one. Without `private` the N goal
# rows collapse onto ~1.5 directions.
#
# ⚠ DO NOT USE THIS ON AN MJX ENV. There `global_state` IS `obs.reshape(E, -1)`,
# so `z` is computed from numbers the encoder already saw: dead weight plus an
# extra `f_percept`. On MJX compare `local` vs `local_private`; on SMAX compare
# `local_global` vs `local_global_private`. Crossing the two families changes two
# things at once.
#
# ⚠ NOT checkpoint-compatible with ANY other arm. The manager tree carries
# `f_enc_*` + `f_Mspace_agent_kernel`/`goal_head_agent_kernel` + `f_percept_*`.
# The five latents are separated by PAIRS of keys, never one alone — `f_enc_0` is
# in all four local variants, `f_percept_0` is in `centralized`/`local_global`/
# `local_global_private`, `f_Mspace_agent_kernel` is in both private ones — which
# is how `goal_dependence_probe._dims_from_checkpoint` tells them apart.
#
# ⚠ `latent_locality_probe.py` and `latent_diversity_probe.py` do NOT work on
# SMAX arms at any latent: both derive per-agent observations by un-flattening
# the stored global state, valid only when the env has no `global_state` hook.
# The diversity probe skips such arms with a message.
#
#   uv run python train.py algorithm=feudal_mappo_jax env=smax_3m \
#       model=feudal_film_local_global_private trial_id=0
#
# Compare against `model=feudal_film_local_global` — one key apart, and the
# difference is precisely "can the N goal rows be distinct from one another".
# Watch `goal_direction_count` across the WHOLE run; its baseline at smax_3m
# (N=3, goal_dim=32) is 2.82 of 3, and at small N a shared projection is far less
# likely to bind, so this arm's motivation is strongest on 3s5z / 5m_vs_6m.
defaults:
  - feudal_film_local_private
  - _self_

model_params:
  manager_latent: local_global_private
