# @package _global_
#
# FeUdal worker with FiLM fusion instead of concatenation.
#
# WHY THIS ARM EXISTS — measured 2026-09-06 by
# `algorithms/feudal_mappo_jax/goal_dependence_probe.py` over all 20 trained
# concat arms (5 env groups x 4 models x 3 trials, 64 paired eval episodes):
#
#   * permuting the manager's goals across agents changes the return by
#     NOTHING (only 5 of 45 non-control trials have a paired CI excluding 0,
#     in both directions) -- the worker does not use the assignment;
#   * ZEROING the goals *improves* the return on 15 of 16 non-control arms
#     (27/45 trials significant, essentially all negative; e.g.
#     mjx_16a_4o_1024/feudal_n05 43.7 -> 133.3) -- the goal is a net-harmful
#     perturbation rather than a directive;
#   * meanwhile the manager's goals are FINE: d_cos_gap_agent ~= d_cos_mean
#     (agent-specific) and d_cos_gap_env is 60-90% of d_cos_mean
#     (state-conditioned). So the failure is the manager->worker channel.
#
# The scale explanation is already spent: `normalize_pooled_goal` cut the goal
# block from 59-78% of the worker's layer-1 variance to a measured 14-19%. What
# remains are two STRUCTURAL properties of concatenation:
#
#   1. the default is influence, not no-influence. Orthogonal init makes the
#      goal columns live from step 0, so goal-agnosticism is something the
#      worker must actively learn -- and the numbers above say it never
#      finished. FiLM's zero-init makes identity the default and influence the
#      thing that has to be earned.
#   2. concat can only TRANSLATE the policy. d(preactivation)/d(obs) = W_obs,
#      with no dependence on the goal at all, so a concatenated goal cannot
#      change which observation features matter. FiLM is multiplicative
#      (h <- (1 + gamma(g)) * h + beta(g)), so the goal gates how the
#      observation is read -- which is what "work the box on your left, ignore
#      the one behind you" actually requires.
#
# ⚠ NOT checkpoint-compatible with the `feudal` arms: concat's first Dense has
# input width obs_dim + goal_dim (56), FiLM's is obs_dim (40). This arm trains
# from scratch and writes to results/<env>/feudal_film/.
#
# ACCEPTANCE TEST is the same probe. Every gap is `real - variant`. Success is
# ALL THREE, each with a paired CI excluding 0:
#   * gap_zeroed   > 0  the goal channel EARNS return against no goal at all;
#   * gap_constant > 0  that return comes from the goal's CONTENT, not from a
#                       frozen vector the worker co-adapted to;
#   * gap_permuted > 0  and specifically from the per-agent ASSIGNMENT.
# Today the concat arms fail all three. Expect FiLM alone to move gap_zeroed off
# its negative value at best: at intrinsic_coef=0 nothing in the worker's
# objective asks it to follow the goal, so the other two likely need the
# objective side too -- and the n01/n05 data says the current intrinsic reward
# is not it.
#
# ⚠ gap_zeroed > 0 IS THE THIRD CONDITION, ADDED 2026-09-17, and it replaces the
# weaker `gap_zeroed ~ 0` this file used to ask for. That waypoint was written
# against the 2026-09-06 failure where the goal COST return (zeroing it improved
# 15 of 16 arms), so "stopped costing" was the thing to reach. But ~0 means
# `real ~ zeroed`, i.e. deleting the channel is FREE -- which a useful channel
# cannot be. Measured counterexample that passes the old two-condition test and
# is still worth nothing: mjx_12a_4o_4444_512/feudal_n01_local_private, 64 paired
# episodes --
#     real 281.4 | zeroed 283.8 | permuted 257.3 | env_permuted 260.3 |
#     constant 240.3
# gap_permuted +22 and gap_constant +41 (both positive in all 3 seeds) while
# gap_zeroed is -2.4. Deleting the goal is free; CORRUPTING it costs ~20-40, and
# both nulls cost about the same. That is a COHERENCE requirement, not an
# information channel: manager_latent=local_private builds s_i from obs_i, so
# g_i partly re-encodes what the worker already sees and contradicting it is
# just an off-distribution hit. gap_permuted there measures damage from
# incoherence, not value from the assignment -- and the arm ties its matched
# control feudal_zerogoal outright (281.4 vs 281.1).
#
# ⚠ THREE NECESSARY CONDITIONS ARE STILL NOT SUFFICIENT. Every variant is an
# off-distribution perturbation of an already-trained policy, so by the same
# asymmetry recorded in CLAUDE.md a positive gap is WEAK evidence and a zero gap
# is STRONG negative evidence. The probe can only report what the trained policy
# is sensitive to; it cannot tell you the mechanism bought anything. The
# decisive test is the BETWEEN-ARM one -- this arm's return against
# feudal_zerogoal trained from scratch on the same env group and seeds. Run the
# probe to rule arms OUT cheaply; cite the between-arm gap to rule one IN.
#
# ⚠ A LARGE gap_zeroed IS NOT PROGRESS TOWARD THIS — read gap_constant too
# (added 2026-09-14). `mjx_12a_3o_trunc_1024/feudal_film_n01_local` scores
# gap_zeroed +280 with gap_permuted ~ 0, and one FROZEN vector recovers 95% of
# its return: the worker had co-adapted to a constant modulation, so the goal
# channel is maximally live and completely decorative at once. The degenerate
# outcome and the headline success condition look identical without the
# `constant` block. See CLAUDE.md, "MEASURED 2026-09-14".
#
# Free pre-flight check, before spending a run: at init the FiLM layers are
# exactly identity, so every eval variant must return BITWISE-identical values
# (same positive control as feudal_zerogoal).
#
#   uv run python train.py algorithm=feudal_mappo_jax env=mjx_16a_4o_trunc_1024 \
#       model=feudal_film trial_id=0
#
# Compare against `model=feudal` on the SAME env group -- the two differ in
# exactly one key.
model_params:
  hidden_dim: 168
  worker_fusion: film
