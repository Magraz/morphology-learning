# @package _global_
#
# FiLM feudal with a 2-WIDE GOAL and a 32-wide manager bottleneck — still the
# LEARNED latent. Differs from `feudal_film` in exactly the two width keys.
#
# WHY THIS ARM EXISTS — it is the ATTRIBUTION RUNG, and without it no grounded
# number means anything. A grounded arm (`feudal_film_position`,
# `feudal_film_waypoint`) changes TWO things against `feudal_film` at once:
#
#   1. the goal becomes a physical quantity (an env readout, zero parameters);
#   2. the goal becomes 2-wide instead of 32-wide.
#
# (2) is not cosmetic. Under FiLM the gamma/beta maps go from rank-32 to
# RANK-2: gamma = Dense(hidden)(goal) with a 2-d input, so the set of achievable
# per-unit gains is a 2-dimensional subspace of R^hidden instead of a 32-d one.
# That is a real reduction in what a directive can express, and it is the whole
# reason this rung exists — attributing a return gap to "grounding" without it
# would be attributing it to a confound.
#
# ⚠ What is NOT the mechanism, measured rather than assumed: the goal's SHARE of
# layer-1 preactivation variance is 9.8% at goal_dim 32, 16 AND 2 alike, because
# `normalize_pooled_goal` fixes ||w|| = 1 and that share is set by the block's
# norm, not its width. (The same measurement reproduces CLAUDE.md's recorded
# 91.6% for the pre-normalization raw sum, which is what validates it.) An
# earlier draft of this header claimed the share collapses to ~1% at goal_dim=2.
# It does not. Under CONCAT the real cost of narrowing is init goal-dominance:
# swapping the goal moves the untrained action mean by 47.3% of its own RMS at
# goal_dim=32 and 20.3% at 2 — against exactly 0.000 for FiLM at both widths.
#
#   narrow   - film    = the cost of the narrow channel
#   position - narrow  = the value of grounding
#
# Same one-thing-per-rung discipline as the drift ladder
# (baseline -> trunc -> drift) in CLAUDE.md.
#
# ⚠ It is also the LONGEST-LEAD item: it depends on nothing in the grounded
# implementation, so start it training as soon as the foundation lands.
#
# ⚠ `manager_latent_dim` must stay 32 (the latent default). It sizes `f_Mspace`
# and hence the manager's core input; fused with `goal_dim: 2` the core would
# see 2*n_agents numbers as its only view of the world.
#
# ⚠ NOT checkpoint-compatible with `feudal_film` (goal head 2 wide, not 32).
#
#   uv run python train.py algorithm=feudal_mappo_jax \
#       env=mjx_12a_3o_trunc_1024 model=feudal_film_narrow trial_id=0
defaults:
  - feudal_film
  - _self_

model_params:
  goal_dim: 2
  manager_latent_dim: 32
