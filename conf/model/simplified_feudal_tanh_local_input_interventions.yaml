# @package _global_
# Delta from `simplified_feudal_tanh_relative_input`: interventions false -> true.
#
# Training-time simulator forks (algorithms/simplified_feudal_mappo_jax/
# interventions.py). At every manager decision each env is forked once per agent
# i, before the first worker step: N ~ U{1..n_agents-1} teammates are teleported
# within `intervention_radius` (1.5 world units, centre to centre) of agent i and
# given agent i's waypoint offset from their new positions. Each fork runs one
# goal_horizon window under the same frozen policies as its own episode, and its
# transitions join both levels' PPO batches as extra env columns. Only agent i's
# manager action is trained on in its fork (the recruits' goals were imposed);
# every live agent's worker action is. The manager critic reads a context block
# [is_intervention, one_hot(i), N / (n_agents - 1)].
#
# Execution and evaluation are unchanged; `total_steps` counts main env steps
# only. At interval 1 a 2a/4o run simulates ~3x the main steps (1 + n_agents).
# Read `intervention_valid_frac` (and per N) before return.
#
# The manager critic is n_agents + 2 inputs wider, so checkpoints do not load
# into the parent. The interval and radius leave checkpoints shape-identical:
# set them in a one-key child group (e.g. `..._interventions_every2`), never on
# the CLI. Plan: plans/simplified_feudal_interventions_2026-10-05.md.
#
#   uv run python train.py algorithm=simplified_feudal_mappo_jax \
#       env=mjx_2a_4o_1122_1024_gs \
#       model=simplified_feudal_tanh_relative_input_interventions trial_id=0
defaults:
  - simplified_feudal_tanh_local_input
  - _self_

model_params:
  interventions: true
  # Defaults, declared so the values are visible and child groups can set them.
  intervention_radius: 1.5      # world units, recruit centre to focal centre
  intervention_interval: 1      # fork at every k-th manager decision
