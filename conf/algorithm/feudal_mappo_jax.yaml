# @package _global_
# FeUdal MAPPO (algorithms/feudal_mappo_jax): a centralized manager emits one
# unit-norm latent goal per agent, a goal-conditioned worker emits the primitive
# action. The worker's PPO surface is identical to mappo_jax so the two are
# drop-in comparable.
#
# ⚠ Always pair with `model=feudal`, never `model=mlp`: the results path
# experiments/results/<env>/<model>/ does not include the algorithm, so `mlp`
# writes into the mappo_jax baseline's directory (and `checkpoint=true` would
# load a 2-state mappo_jax checkpoint into the 4-state feudal train state).
algorithm: feudal_mappo_jax
params:
  n_epochs: 6
  n_total_steps: 100000000.0     # float on purpose; env groups override when different
  n_minibatches: 8
  # Must stay per-env: it is the static length of the jitted collect scan.
  # Batch = n_steps * env.n_envs, and n_envs is a literal in each MJX env group.
  n_steps: 1048
  parameter_sharing: true       # shared-worker path only, as in mappo_jax
  lr: 0.0003
  gamma: 0.99
  lmbda: 0.95
  eps_clip: 0.2
  ent_coef: 0.01
  grad_clip: 0.5

  # ---- FeUdal ----
  # Goal horizon c: the lag scored by d_cos(s_{t+c} - s_t, g_t), the number of
  # goals the worker pools over, and the LSTM core's dilation radius. Horizons
  # straddling an episode boundary are masked out, so on a short-episode env a
  # large c starves the manager — watch `valid_fraction`.
  goal_horizon: 10
  # alpha: the worker's intrinsic-reward weight, as a GRADIENT FRACTION, not a
  # reward coefficient. The two streams are each normalized to unit std and
  # combined as `adv = adv_ext + alpha * adv_int`.
  # 0.0 leaves the intrinsic path inert (goals still condition the worker) and is
  # a STATIC no-op: no V^I is built and the checkpoint format is unchanged.
  # ⚠ The alpha>0 arms (conf/model/feudal_n01, feudal_n05) converged to a
  # task-free fixed point — worker and manager climbing each other's cosine —
  # under the OLD reward-level fold. Default stays OFF: this is the control.
  # Watch `adv_ext_std_raw` / `adv_int_std_raw` for the raw per-stream scales.
  intrinsic_coef: 0.0
  # "linear" decays alpha to 0 across n_total_steps; "none" holds it. Required
  # for asymptotic correctness — at constant alpha that gradient fraction points
  # at a task-irrelevant objective forever.
  intrinsic_anneal: linear
  manager_lr: 0.0003
  manager_val_coef: 0.5
  # The manager operates on a longer timescale, so this may exceed `gamma`.
  manager_gamma: 0.99
  # Full-batch gradient passes per update. The transition PG has no
  # importance-sampling correction, so >1 is uncorrected off-policy.
  n_manager_epochs: 1
  # V^M regresses fixed targets, so extra passes are ordinary supervised fitting.
  # Separate from n_manager_epochs because the worker critic gets
  # n_epochs * n_minibatches (48) steps per update; at 1, V^M is ~50x
  # undertrained and `manager_explained_variance` stays negative.
  n_manager_critic_epochs: 8

  # ---- goal-usefulness diagnostics ----
  # Deterministic episodes per eval. Eval cost is the fixed env.max_steps
  # sequential scan, so extra episodes are near-free up to ~32 envs of width.
  # ⚠ mappo_jax sets 32, so feudal-vs-flat currently also compares two eval
  # noise floors; match them before reading a small gap between the stacks.
  n_eval_episodes: 16
  # Run the permuted/zeroed goal-ablation eval blocks alongside the real one.
  # Three variants share ONE scan at 3x vmapped width — measured 1.91x one eval
  # (not 3x), i.e. ~+8.5% wall on a production-length run. Set false to disable.
  eval_goal_variants: true
  # Cyclic shift for the permutation nulls (agent and env axes). A cyclic shift
  # is a guaranteed derangement, unlike a random permutation which leaves ~1
  # agent in 16 holding its own goal. Must not be a multiple of n_agents.
  goal_permute_shift: 1
model_params:
  hidden_dim: 168
  # Width of the manager's latent state `s` AND of the goal `g` (in FuN a goal is
  # a direction in the state embedding). Also the manager's whole information
  # bottleneck — the core consumes `s`.
  goal_dim: 32
  manager_hidden_dim: 256
  # "mlp" (stateless) or "dilated_lstm" (FuN's dilated recurrence). mlp is the
  # default so goal-mechanism effects stay attributable separately from
  # recurrence effects.
  manager_core: mlp
  # Optional bias-free Dense on the goal before it meets the obs (FuN's `phi`).
  # null = raw concat fusion.
  goal_embed_dim: null
