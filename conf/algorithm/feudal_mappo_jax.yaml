# @package _global_
# FeUdal MAPPO (algorithms/feudal_mappo_jax): a FeUdal-Networks hierarchy over
# the same functional MJX envs as mappo_jax — a centralized manager emits one
# unit-norm latent goal per agent, a goal-conditioned worker emits the primitive
# action. The worker's PPO surface is identical to mappo_jax so the two are
# drop-in comparable; the feudal-only knobs live below and in conf/model/feudal.
#
# NOTE: always pair this with `model=feudal`, never `model=mlp`. The results path
# is experiments/results/<env>/<model>/ and does NOT include the algorithm, so
# `model=mlp` would write into the mappo_jax baseline's directory (and a
# `checkpoint=true` resume would try to load a 2-state mappo_jax checkpoint into
# the 4-state feudal train state).
algorithm: feudal_mappo_jax
params:
  n_epochs: 6
  n_total_steps: 100000000.0     # float on purpose; env groups override when different
  n_minibatches: 8
  # Rollout length per env stream. Unlike the torch stacks this must stay
  # per-env: it is the static length of the jitted collect scan. The batch is
  # n_steps * env.n_envs, and n_envs is a literal in each MJX env group (a vmap
  # width, never core-derived), so the batch is still fixed by config alone.
  n_steps: 1024
  parameter_sharing: true       # shared-worker path only, as in mappo_jax
  lr: 0.0003
  gamma: 0.99
  lmbda: 0.95
  eps_clip: 0.2
  ent_coef: 0.01
  grad_clip: 0.5

  # ---- FeUdal ----
  # Goal horizon c: the lag at which the manager's directive is scored
  # (d_cos(s_{t+c} - s_t, g_t)), the number of goals the worker's conditioning
  # pools over, and the dilation radius of the LSTM core. Note c interacts with
  # episode length: horizons that straddle an episode boundary are masked out of
  # the manager loss, so on a short-episode env a large c starves the manager
  # (watch `valid_fraction`).
  goal_horizon: 10
  # alpha: the worker's intrinsic-reward weight, as a GRADIENT FRACTION. 0.0
  # leaves the intrinsic path inert — goals still condition the worker, but
  # nothing rewards following them — and is a STATIC no-op (no V^I is built and
  # the checkpoint format is unchanged, so `feudal_a0` runs still resume).
  #
  # The two streams are combined at the ADVANTAGE level, each normalized to unit
  # std first: `adv = adv_ext + alpha * adv_int`. So alpha is the mixing ratio of
  # the two gradient directions, NOT a coefficient on a reward.
  #
  # ⚠ THE OLD CALIBRATION HERE WAS WRONG IN KIND, and is kept below only as a
  # record of the mistake. It derived alpha=0.5 by comparing alpha*|r^I| = 0.076
  # against the CONVERGED mappo_jax baseline's ~0.39-0.46/step, reading 17-19%.
  # That denominator is the ENDPOINT of learning. The rate that governs whether
  # learning ever starts is the one the policy can currently reach — measured at
  # ~5e-05/step — against which the same alpha is ~1500:1. As a reward
  # coefficient, alpha=0.1 and alpha=0.5 were therefore BOTH ~300-1700x too
  # large during the whole early phase, and both converged to a task-free fixed
  # point (worker and manager climbing each other's cosine: `intrinsic_reward`
  # 0.0002 -> 0.138 monotonically while env reward stayed at ~1e-3 for 1e8
  # steps, on all three of mjx_16a_4o / _trunc / _partition, 3 seeds each).
  # It is an absorbing state, not the transient exploration phase the old note
  # assumed. No value in a 0/0.1/0.5 sweep escapes it — the smallest nonzero
  # member is already ~300x too large.
  #
  # Per-stream normalization removes the scale gap outright, so alpha now means
  # what it reads as at any point in training. The arms live in
  # conf/model/feudal_n01.yaml (0.1) and feudal_n05.yaml (0.5); the default stays
  # OFF so `algorithm=feudal_mappo_jax model=feudal` is the no-intrinsic control.
  #
  # Watch `adv_ext_std_raw` / `adv_int_std_raw` in the training stats — they are
  # the raw per-stream advantage scales, i.e. the gap the normalization absorbs.
  intrinsic_coef: 0.0
  # "linear" decays alpha to exactly 0 across n_total_steps; "none" holds it.
  # Annealing is what makes the ENDPOINT correct: at constant alpha that fraction
  # of the worker's gradient points at a task-irrelevant objective forever.
  intrinsic_anneal: linear
  manager_lr: 0.0003
  manager_val_coef: 0.5
  # The manager operates on a longer timescale than the worker, so this may
  # exceed `gamma`.
  manager_gamma: 0.99
  # Gradient passes per update over the FULL batch. The transition PG has no
  # importance-sampling correction, so >1 is uncorrected off-policy for the
  # policy arm; V^M's regression has no such constraint (fixed targets) and is
  # given its own count below.
  n_manager_epochs: 1
  # V^M regresses fixed targets, so extra passes are ordinary supervised
  # optimization. Kept separate because the worker critic gets
  # n_epochs * n_minibatches (48 at the defaults) gradient steps per update; at 1
  # the manager critic would be ~50x undertrained by comparison and
  # `manager_explained_variance` stays negative.
  n_manager_critic_epochs: 8
model_params:
  hidden_dim: 168
  # Width of the manager's latent state `s` AND of the goal `g` (in FuN a goal is
  # a direction in the state embedding, so they share a space). Also the
  # manager's whole information bottleneck — the core consumes `s`.
  goal_dim: 32
  manager_hidden_dim: 256
  # "mlp" (stateless) or "dilated_lstm" (FuN's dilated recurrence). mlp is the
  # default so goal-mechanism effects stay attributable separately from
  # recurrence effects.
  manager_core: mlp
  # Optional bias-free Dense on the goal before it meets the obs (FuN's `phi`).
  # null = raw concat fusion.
  goal_embed_dim: null
