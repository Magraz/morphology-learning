hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers: []
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers: []
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: null
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - algorithm=rmappo_jax
    - env=rover_2poi_c8
    - model=rmappo,mappo_mlp
    - trial_id=0
    - view=true
  job:
    name: train
    chdir: false
    override_dirname: algorithm=rmappo_jax,env=rover_2poi_c8,model=rmappo,mappo_mlp,trial_id=0,view=true
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.3'
    cwd: /home/magraz/morphology-learning
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/magraz/morphology-learning/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      seeds: standard
      model: mlp_shared
      env: rover_2poi_c8
      algorithm: rmappo_jax
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
algorithm: rmappo_jax
params:
  n_epochs: 15
  n_minibatches: 1
  n_steps: 200
  n_total_steps: 10000000.0
  parameter_sharing: true
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 1.0e-05
  gamma: 0.99
  lmbda: 0.95
  eps_clip: 0.2
  ent_coef: 0.01
  val_coef: 1.0
  use_max_grad_norm: true
  grad_clip: 10.0
  use_valuenorm: true
  use_huber_loss: true
  huber_delta: 10.0
  use_clipped_value_loss: true
  use_value_active_masks: true
  use_policy_active_masks: true
  use_proper_time_limits: false
  use_linear_lr_decay: false
  data_chunk_length: 10
  n_eval_episodes: 32
  eval_interval: 25
  random_seeds:
  - 118
  - 1234
  - 8764
  - 3486
  - 2487
  - 5439
  - 6584
  - 7894
  - 523
  - 69
  - 365
  - 598
  - 6354
  - 4857
  - 3
  - 7
  - 86
  - 784
  - 968
  - 23
  - 4421
  - 157
  - 9032
  - 612
  - 3398
  - 745
  - 2056
  - 88
  - 1390
  - 5571
model_params:
  hidden_size: 64
  layer_N: 1
  use_ReLU: true
  use_feature_normalization: true
  gain: 0.01
  recurrent_N: 1
  critic_type: mlp
env:
  environment: rover
  n_envs: 32
  n_agents: 16
  max_steps: 100
  world_size:
  - 10.0
  - 10.0
  spawn_region: null
  dynamics:
    max_speed: 0.5
    max_turn: 0.7853981633974483
  observation:
    type: sector_density
    n_sectors: 8
    sensor_radius: 3.0
  reward:
    type: coupling_depletion
  pois:
    type: static
    radius: 1.0
    value: 1.0
    rate: 0.05
    entries:
    - position:
      - 2.0
      - 8.0
      coupling: 8
    - position:
      - 8.0
      - 2.0
      coupling: 8
device: cpu
trial_id: 0
view: true
checkpoint: false
evaluate: false
debug: false
n_jobs: 1
